<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Понг</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none}canvas{background:#1e293b;border:4px solid #475569;border-radius:16px;box-shadow:0 0 30px rgba(56,189,248,0.2)}</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');c.width=Math.min(innerWidth*0.9,600);c.height=innerHeight*0.85;
let p1,p2,b,score1,score2,loop;
function init(){p1={y:c.height/2-40,h:80,w:10};p2={y:c.height/2-40,h:80,w:10};b={x:c.width/2,y:c.height/2,r:8,vx:4,vy:4};score1=0;score2=0;if(loop)clearInterval(loop);loop=setInterval(update,1000/60)}
function update(){b.x+=b.vx;b.y+=b.vy;if(b.y-b.r<0||b.y+b.r>c.height)b.vy*=-1;
if(b.x-b.r<20&&b.y>p1.y&&b.y<p1.y+p1.h)b.vx=Math.abs(b.vx);if(b.x+b.r>c.width-20&&b.y>p2.y&&b.y<p2.y+p2.h)b.vx=-Math.abs(b.vx);
if(b.x<0){score2++;reset()}if(b.x>c.width){score1++;reset()}draw()}
function reset(){b.x=c.width/2;b.y=c.height/2;b.vx=(Math.random()>0.5?1:-1)*4;b.vy=(Math.random()>0.5?1:-1)*4}
function draw(){x.fillStyle="#1e293b";x.fillRect(0,0,c.width,c.height);x.fillStyle="#334155";x.fillRect(c.width/2-2,0,4,c.height);
x.fillStyle="#38bdf8";x.fillRect(10,p1.y,p1.w,p1.h);x.fillRect(c.width-20,p2.y,p2.w,p2.h);x.fillStyle="white";x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill();
x.fillStyle="#94a3b8";x.font="20px Arial";x.fillText(score1,c.width/4,30);x.fillText(score2,c.width*0.75,30)}
document.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();p1.y=e.clientY-r.top-p1.h/2;if(p1.y<0)p1.y=0;if(p1.y+p1.h>c.height)p1.y=c.height-p1.h});
let ts=0;c.addEventListener('touchstart',e=>{ts=e.touches[0].clientY});c.addEventListener('touchmove',e=>{e.preventDefault();let r=c.getBoundingClientRect();let y=e.touches[0].clientY-r.top;p1.y=y-p1.h/2;if(p1.y<0)p1.y=0;if(p1.y+p1.h>c.height)p1.y=c.height-p1.h},{passive:false});
init();
</script></body></html>

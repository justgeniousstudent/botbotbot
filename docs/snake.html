<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #17212b; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: system-ui, sans-serif;
            overflow: hidden;
            touch-action: none; /* Отключаем скролл страницы при свайпах */
        }
        canvas { 
            background: #232e3c; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 95vw;
            max-height: 60vh;
        }
        .controls {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            background: #2b5278;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0 #1e3a56;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #1e3a56;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        
        .score {
            color: #7f91a4;
            font-size: 18px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div class="score" id="scoreDisplay">Счет: 0</div>
    
    <div class="controls">
        <button class="btn btn-up" onclick="changeDir('UP')">↑</button>
        <button class="btn btn-left" onclick="changeDir('LEFT')">←</button>
        <button class="btn btn-down" onclick="changeDir('DOWN')">↓</button>
        <button class="btn btn-right" onclick="changeDir('RIGHT')">→</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        // Адаптация размера под экран (чтобы на телефоне было видно)
        const size = Math.min(window.innerWidth * 0.9, 400);
        canvas.width = size;
        canvas.height = size;
        
        const box = size / 20; // Размер клетки
        let snake, direction, nextDirection, food, score, gameLoop;

        function init() {
            snake = [{x: 10, y: 10}];
            direction = "RIGHT";
            nextDirection = "RIGHT";
            food = { 
                x: Math.floor(Math.random()*19), 
                y: Math.floor(Math.random()*19) 
            };
            score = 0;
            document.getElementById('scoreDisplay').textContent = `Счет: ${score}`;
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, 120);
        }

        function changeDir(newDir) {
            if (newDir === "UP" && direction !== "DOWN") nextDirection = "UP";
            if (newDir === "DOWN" && direction !== "UP") nextDirection = "DOWN";
            if (newDir === "LEFT" && direction !== "RIGHT") nextDirection = "LEFT";
            if (newDir === "RIGHT" && direction !== "LEFT") nextDirection = "RIGHT";
        }

        function draw() {
            direction = nextDirection;
            
            // Красивый фон
            ctx.fillStyle = "#232e3c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем еду (яблоко)
            ctx.font = `${box * 1.2}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🍎", food.x * box + box/2, food.y * box + box/2);

            // Рисуем змейку
            for(let i = 0; i < snake.length; i++) {
                const isHead = i === 0;
                
                // Закругленные сегменты
                ctx.beginPath();
                ctx.fillStyle = isHead ? "#3a6ea5" : "#2b5278";
                ctx.roundRect(snake[i].x * box + 2, snake[i].y * box + 2, box - 4, box - 4, 6);
                ctx.fill();

                // Глаза на голове
                if (isHead) {
                    ctx.fillStyle = "white";
                    let eyeX1, eyeY1, eyeX2, eyeY2;
                    const cx = snake[i].x * box + box/2;
                    const cy = snake[i].y * box + box/2;
                    const offset = box * 0.2;

                    if (direction === "RIGHT") { eyeX1 = cx + offset; eyeY1 = cy - offset; eyeX2 = cx + offset; eyeY2 = cy + offset; }
                    if (direction === "LEFT") { eyeX1 = cx - offset; eyeY1 = cy - offset; eyeX2 = cx - offset; eyeY2 = cy + offset; }
                    if (direction === "UP") { eyeX1 = cx - offset; eyeY1 = cy - offset; eyeX2 = cx + offset; eyeY2 = cy - offset; }
                    if (direction === "DOWN") { eyeX1 = cx - offset; eyeY1 = cy + offset; eyeX2 = cx + offset; eyeY2 = cy + offset; }

                    ctx.beginPath(); ctx.arc(eyeX1, eyeY1, box*0.1, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(eyeX2, eyeY2, box*0.1, 0, Math.PI*2); ctx.fill();
                }
            }

            // Логика движения
            let headX = snake[0].x;
            let headY = snake[0].y;

            if(direction === "LEFT") headX--;
            if(direction === "UP") headY--;
            if(direction === "RIGHT") headX++;
            if(direction === "DOWN") headY++;

            // Проверка на поедание яблока
            if(headX === food.x && headY === food.y) {
                score++;
                document.getElementById('scoreDisplay').textContent = `Счет: ${score}`;
                food = { 
                    x: Math.floor(Math.random()*19), 
                    y: Math.floor(Math.random()*19) 
                };
            } else {
                snake.pop(); // Удаляем хвост, если не съели яблоко
            }

            let newHead = { x: headX, y: headY };

            // Проверка на столкновение (стены или свой хвост)
            if(headX < 0 || headX >= 20 || headY < 0 || headY >= 20 || collision(newHead, snake)) {
                clearInterval(gameLoop);
                
                // Экран Game Over
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 24px Arial";
                ctx.fillText("Игра окончена!", canvas.width/2, canvas.height/2 - 20);
                ctx.fillStyle = "white";
                ctx.font = "18px Arial";
                ctx.fillText(`Твой счет: ${score}`, canvas.width/2, canvas.height/2 + 20);
                
                setTimeout(init, 2500); // Перезапуск через 2.5 сек
                return;
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }

        // Управление с клавиатуры (для ПК)
        document.addEventListener("keydown", (e) => {
            if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault(); // Отключаем скролл страницы
            }
            if(e.key === "ArrowLeft") changeDir("LEFT");
            if(e.key === "ArrowUp") changeDir("UP");
            if(e.key === "ArrowRight") changeDir("RIGHT");
            if(e.key === "ArrowDown") changeDir("DOWN");
        });

        // Свайпы по экрану (для телефона)
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener("touchstart", (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        canvas.addEventListener("touchend", (e) => {
            if(!touchStartX || !touchStartY) return;
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            if(Math.abs(dx) > Math.abs(dy)) {
                if(dx > 30) changeDir("RIGHT");
                else if(dx < -30) changeDir("LEFT");
            } else {
                if(dy > 30) changeDir("DOWN");
                else if(dy < -30) changeDir("UP");
            }
            touchStartX = 0; touchStartY = 0;
        }, {passive: true});

        // Запуск
        init();
    </script>
</body>
</html>

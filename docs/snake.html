<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <style>
        body { margin: 0; background: #17212b; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #232e3c; border-radius: 10px; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="game" width="300" height="300"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const box = 15;
        let snake, direction, food, score, game;

        function init() {
            snake = [{x: 10*box, y: 10*box}];
            direction = "RIGHT";
            food = { x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box };
            score = 0;
            if(game) clearInterval(game);
            game = setInterval(draw, 100);
        }

        function draw() {
            ctx.fillStyle = "#232e3c";
            ctx.fillRect(0, 0, 300, 300);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? "#2b5278" : "#3a6ea5";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(direction === "LEFT") snakeX -= box;
            if(direction === "UP") snakeY -= box;
            if(direction === "RIGHT") snakeX += box;
            if(direction === "DOWN") snakeY += box;

            if(snakeX === food.x && snakeY === food.y) {
                food = { x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= 300 || snakeY < 0 || snakeY >= 300 || collision(newHead, snake)) {
                clearInterval(game);
                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.fillText("Игра окончена!", 70, 150);
                setTimeout(init, 2000);
                return;
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }

        // Управление
        document.addEventListener("keydown", (e) => {
            if(e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
            if(e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
            if(e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
            if(e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
        });

        // Свайпы для телефона
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener("touchstart", (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, false);

        canvas.addEventListener("touchmove", (e) => {
            if(!touchStartX || !touchStartY) return;
            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;
            let dx = touchStartX - touchEndX;
            let dy = touchStartY - touchEndY;

            if(Math.abs(dx) > Math.abs(dy)) {
                if(dx > 0 && direction !== "RIGHT") direction = "LEFT";
                else if(dx < 0 && direction !== "LEFT") direction = "RIGHT";
            } else {
                if(dy > 0 && direction !== "DOWN") direction = "UP";
                else if(dy < 0 && direction !== "UP") direction = "DOWN";
            }
            touchStartX = 0; touchStartY = 0;
        }, false);

        init();
    </script>
</body>
</html>

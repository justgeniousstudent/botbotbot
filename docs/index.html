<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Игры</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="menu" class="screen active">
  <h1>❄️ Выбери игру ❄️</h1>
  <div class="grid">
    <button class="game-btn">🐍 Змейка</button>
    <button class="game-btn">☃️ Flappy</button>
    <button class="game-btn">🔢 2048</button>
    <button class="game-btn">🧱 Тетрис</button>
    <button class="game-btn">🏓 Понг</button>
    <button class="game-btn">🧱 Арканоид</button>
    <button class="game-btn">👾 Инвейдеры</button>
    <button class="game-btn">🃏 Память</button>
    <button class="game-btn">🎯 Кликер</button>
  </div>
  <div id="timer">⏳ Пробный: 10:00</div>
</div>
<div id="game" class="screen">
  <button id="back">← В меню</button>
  <div id="game-box"></div>
</div>
<div id="pay" class="screen">
  <h2>⏰ Время вышло</h2>
  <p>Безлимит за 20 ⭐</p>
  <button id="pay-btn">⭐ Купить за 20 звёзд</button>
</div>
<script src="app.js"></script>
</body>
</html>

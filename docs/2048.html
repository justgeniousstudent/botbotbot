<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, sans-serif; touch-action: none; color: white; overflow: hidden; background-image: radial-gradient(circle, #1e293b 1px, transparent 1px); background-size: 20px 20px; }
        .header { display: flex; justify-content: space-between; width: 90vmin; max-width: 400px; margin-bottom: 20px; align-items: center; }
        .title { font-size: 32px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        .score-box { background: #1e293b; padding: 10px 20px; border-radius: 10px; text-align: center; border: 2px solid #475569; }
        .score-box div:first-child { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        .score-box div:last-child { font-size: 20px; font-weight: bold; }
        
        #game-container { background: #1e293b; padding: 10px; border-radius: 12px; position: relative; border: 4px solid #475569; width: 90vmin; height: 90vmin; max-width: 400px; max-height: 400px; }
        .grid-bg { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; width: 100%; height: 100%; }
        .cell { background: #334155; border-radius: 8px; }
        
        #tiles { position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; z-index: 10; }
        .tile {
            display: flex; align-items: center; justify-content: center;
            font-size: 8vmin; font-weight: bold; border-radius: 8px;
            color: #0f172a; transition: transform 0.1s;
            animation: pop 0.2s ease-in-out;
        }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
        
        .tile-2 { background: #e2e8f0; } .tile-4 { background: #bae6fd; } .tile-8 { background: #7dd3fc; }
        .tile-16 { background: #38bdf8; color: white; } .tile-32 { background: #0ea5e9; color: white; }
        .tile-64 { background: #0284c7; color: white; } .tile-128 { background: #6366f1; color: white; }
        .tile-256 { background: #4f46e5; color: white; } .tile-512 { background: #4338ca; color: white; }
        .tile-1024 { background: #fbbf24; color: white; } .tile-2048 { background: #f59e0b; color: white; box-shadow: 0 0 20px #fbbf24; }

        .game-over { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); display: none; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; z-index: 20; }
        .game-over.active { display: flex; }
        .game-over h2 { color: #ef4444; margin-bottom: 10px; }
        .game-over button { background: #38bdf8; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: #0f172a; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">2048</div>
        <div class="score-box"><div>Счет</div><div id="score">0</div></div>
    </div>
    <div id="game-container">
        <div class="grid-bg">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div id="tiles"></div>
        <div class="game-over" id="game-over">
            <h2>Игра окончена!</h2>
            <button onclick="initGame()">Начать заново</button>
        </div>
    </div>
    <script>
        let board = []; let score = 0;
        let tilesContainer = document.getElementById('tiles');
        
        function initGame() {
            board = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0; document.getElementById('score').textContent = score;
            document.getElementById('game-over').classList.remove('active');
            addRandomTile(); addRandomTile(); render();
        }
        function addRandomTile() {
            let empty = [];
            for(let r=0; r<4; r++) { for(let c=0; c<4; c++) { if(board[r][c] === 0) empty.push({r, c}); } }
            if(empty.length > 0) {
                let spot = empty[Math.floor(Math.random() * empty.length)];
                board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        function render() {
            tilesContainer.innerHTML = '';
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    let val = board[r][c];
                    let tile = document.createElement('div');
                    tile.className = 'tile' + (val > 0 ? ` tile-${val}` : '');
                    tile.textContent = val > 0 ? val : '';
                    tilesContainer.appendChild(tile);
                }
            }
        }
        function slide(row) { let arr = row.filter(val => val); let missing = 4 - arr.length; return Array(missing).fill(0).concat(arr); }
        function combine(row) {
            for(let i=3; i>0; i--) { if(row[i] !== 0 && row[i] === row[i-1]) { row[i] *= 2; row[i-1] = 0; score += row[i]; } }
            return row;
        }
        function operateRow(row) { return slide(combine(slide(row))); }
        function move(dir) {
            let moved = false;
            if(dir === 'LEFT' || dir === 'RIGHT') {
                for(let r=0; r<4; r++) {
                    let row = board[r]; if(dir === 'RIGHT') row.reverse();
                    let newRow = operateRow(row); if(dir === 'RIGHT') newRow.reverse();
                    if(JSON.stringify(board[r]) !== JSON.stringify(newRow)) moved = true;
                    board[r] = newRow;
                }
            } else {
                for(let c=0; c<4; c++) {
                    let row = [board[0][c], board[1][c], board[2][c], board[3][c]];
                    if(dir === 'DOWN') row.reverse();
                    let newRow = operateRow(row); if(dir === 'DOWN') newRow.reverse();
                    if(JSON.stringify([board[0][c], board[1][c], board[2][c], board[3][c]]) !== JSON.stringify(newRow)) moved = true;
                    board[0][c] = newRow[0]; board[1][c] = newRow[1]; board[2][c] = newRow[2]; board[3][c] = newRow[3];
                }
            }
            if(moved) { addRandomTile(); render(); document.getElementById('score').textContent = score; checkGameOver(); }
        }
        function checkGameOver() {
            let empty = false;
            for(let r=0; r<4; r++) { for(let c=0; c<4; c++) { if(board[r][c] === 0) empty = true; } }
            if(!empty) {
                let canMove = false;
                for(let r=0; r<4; r++) {
                    for(let c=0; c<4; c++) {
                        if(r<3 && board[r][c] === board[r+1][c]) canMove = true;
                        if(c<3 && board[r][c] === board[r][c+1]) canMove = true;
                    }
                }
                if(!canMove) { document.getElementById('game-over').classList.add('active'); }
            }
        }
        document.addEventListener('keydown', (e) => {
            if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault();
                if(e.key === 'ArrowLeft') move('LEFT'); if(e.key === 'ArrowRight') move('RIGHT');
                if(e.key === 'ArrowUp') move('UP'); if(e.key === 'ArrowDown') move('DOWN');
            }
        });
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, {passive: true});
        document.addEventListener('touchend', (e) => {
            if(!touchStartX || !touchStartY) return;
            let dx = e.changedTouches[0].clientX - touchStartX; let dy = e.changedTouches[0].clientY - touchStartY;
            if(Math.abs(dx) > Math.abs(dy)) { if(dx > 30) move('RIGHT'); else if(dx < -30) move('LEFT'); } 
            else { if(dy > 30) move('DOWN'); else if(dy < -30) move('UP'); }
            touchStartX = 0; touchStartY = 0;
        }, {passive: true});
        initGame();
    </script>
</body>
</html>

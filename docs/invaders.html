<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Инвейдеры</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
        canvas { border: 4px solid #475569; border-radius: 16px; box-shadow: 0 0 30px rgba(56,189,248,0.2); }
        .ctrl { display: flex; gap: 20px; margin-top: 15px; z-index: 10; }
        .b { background: #1e293b; color: #bae6fd; border: 2px solid #38bdf8; border-radius: 12px; width: 60px; height: 60px; font-size: 24px; display: flex; align-items: center; justify-content: center; user-select: none; box-shadow: 0 4px 0 #0f172a; }
        .b:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="ctrl"><div class="b" id="l">←</div><div class="b" id="f">🔥</div><div class="b" id="r">→</div></div>
    <script>
        const c = document.getElementById('c'), x = c.getContext('2d');
        c.width = Math.min(innerWidth * 0.9, 400); c.height = innerHeight * 0.7;
        
        let player, bullets, aliens, aliensDir, loop, score, gameOver;
        let keys = { left: false, right: false }; // Для плавного движения
        let snow = []; // Для снега

        function init() {
            player = { x: c.width/2-15, y: c.height-40, w: 30, h: 30, speed: 5 };
            bullets = []; aliens = []; aliensDir = 1; score = 0; gameOver = false;
            for(let r=0; r<4; r++) { for(let j=0; j<6; j++) { aliens.push({x: j*40+30, y: r*40+40, w: 30, h: 30, alive: true}) } }
            
            // Генерация снега
            snow = [];
            for(let i=0; i<40; i++) {
                snow.push({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 2 + 1, speed: Math.random() * 1 + 0.5 });
            }

            if(loop) clearInterval(loop); loop = setInterval(update, 1000/60);
        }

        function update() {
            if(gameOver) return;
            
            // Плавное движение игрока
            if (keys.left && player.x > 0) player.x -= player.speed;
            if (keys.right && player.x + player.w < c.width) player.x += player.speed;

            bullets.forEach(b => b.y -= 7); bullets = bullets.filter(b => b.y > 0);
            let edge = false;
            aliens.forEach(a => {
                if(!a.alive) return;
                a.x += aliensDir * 1.5;
                if(a.x < 10 || a.x + a.w > c.width - 10) edge = true;
                for(let b of bullets) {
                    if(b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) { a.alive = false; b.y = -100; score += 10; }
                }
                if(a.y + a.h > player.y) { gameOver = true; setTimeout(init, 1500) }
            });
            if(edge) { aliensDir *= -1; aliens.forEach(a => a.y += 15) }
            if(aliens.filter(a => a.alive).length === 0) { setTimeout(init, 1000) }
            
            // Движение снега
            snow.forEach(s => {
                s.y += s.speed;
                if(s.y > c.height) { s.y = 0; s.x = Math.random() * c.width; }
            });

            draw();
        }

        function draw() {
            // 1. Небо (Градиент)
            let skyGrad = x.createLinearGradient(0, 0, 0, c.height);
            skyGrad.addColorStop(0, "#0f172a"); skyGrad.addColorStop(1, "#1e3a8a");
            x.fillStyle = skyGrad; x.fillRect(0, 0, c.width, c.height);

            // 2. Звезды
            x.fillStyle = "rgba(255, 255, 255, 0.3)";
            for(let i=0; i<30; i++) {
                // Используем фиксированные координаты для звезд (просто случайные точки)
                let sx = (i * 43) % c.width; let sy = (i * 67) % (c.height / 2);
                x.fillRect(sx, sy, 2, 2);
            }

            // 3. Снег (задний план)
            x.fillStyle = "rgba(255, 255, 255, 0.4)";
            snow.forEach(s => { x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI*2); x.fill(); });

            // 4. Игрок и пули
            x.fillStyle = "#38bdf8"; x.fillRect(player.x, player.y, player.w, player.h);
            x.fillStyle = "white"; x.shadowBlur = 10; x.shadowColor = "#38bdf8";
            bullets.forEach(b => { x.beginPath(); x.arc(b.x, b.y, 3, 0, Math.PI*2); x.fill() });
            x.shadowBlur = 0;
            
            // 5. Враги
            aliens.forEach(a => { if(a.alive) { x.font = "24px Arial"; x.fillText("👾", a.x, a.y+25) } });
            x.fillStyle = "#94a3b8"; x.font = "20px Arial"; x.fillText("Счет: " + score, 10, 25);
            
            if(gameOver) { x.fillStyle = "rgba(15, 23, 42, 0.8)"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#ef4444"; x.font = "24px Arial"; x.fillText("Игра окончена!", c.width/2-80, c.height/2) }
        }

        // Обработка клавиатуры (плавное движение)
        document.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') keys.left = true;
            if(e.key === 'ArrowRight') keys.right = true;
            if(e.key === ' ') { e.preventDefault(); if(!gameOver) bullets.push({x: player.x+15, y: player.y}) }
        });
        document.addEventListener('keyup', e => {
            if(e.key === 'ArrowLeft') keys.left = false;
            if(e.key === 'ArrowRight') keys.right = false;
        });

        // Кнопки для телефона
        const l = document.getElementById('l'), r = document.getElementById('r'), f = document.getElementById('f');
        l.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; }, {passive: false});
        l.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; }, {passive: false});
        r.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; }, {passive: false});
        r.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; }, {passive: false});
        
        // Для мыши на кнопках
        l.addEventListener('mousedown', () => keys.left = true); l.addEventListener('mouseup', () => keys.left = false); l.addEventListener('mouseleave', () => keys.left = false);
        r.addEventListener('mousedown', () => keys.right = true); r.addEventListener('mouseup', () => keys.right = false); r.addEventListener('mouseleave', () => keys.right = false);
        
        f.addEventListener('click', () => { if(!gameOver) bullets.push({x: player.x+15, y: player.y}) });

        // Сенсор для перемещения (свайп)
        c.addEventListener('touchmove', e => { 
            e.preventDefault(); let rect = c.getBoundingClientRect(); 
            player.x = e.touches[0].clientX - rect.left - player.w/2; 
            if(player.x<0) player.x=0; 
            if(player.x+player.w>c.width) player.x=c.width-player.w; 
        }, {passive: false});

        init();
    </script>
</body>
</html>

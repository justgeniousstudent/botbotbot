<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mario</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
        #game-container { position: relative; width: 100%; max-width: 800px; height: 80vh; border: 4px solid #475569; border-radius: 16px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #87CEEB; }
        
        /* Мобильные кнопки */
        .controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .btn-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn { 
            background: rgba(30, 41, 59, 0.7); color: white; border: 2px solid rgba(56, 189, 248, 0.5); 
            border-radius: 50%; width: 60px; height: 60px; font-size: 24px; font-weight: bold;
            display: flex; justify-content: center; align-items: center; user-select: none; backdrop-filter: blur(4px);
        }
        .btn:active { background: rgba(56, 189, 248, 0.8); transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <div class="controls">
            <div class="btn-group">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
            <div class="btn-group">
                <div class="btn" id="btn-jump">▲</div>
            </div>
        </div>
    </div>
    <script src="mario-engine.js"></script>
</body>
</html>

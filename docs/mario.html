<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Super Mario Winter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; font-family: 'Press Start 2P', cursive; }
        #game-container { position: relative; width: 100%; max-width: 800px; height: 80vh; border: 4px solid #475569; border-radius: 16px; overflow: hidden; background: #87CEEB; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
        .controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .btn-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn { background: rgba(30, 41, 59, 0.8); color: white; border: 2px solid #38bdf8; border-radius: 50%; width: 60px; height: 60px; font-size: 20px; display: flex; justify-content: center; align-items: center; user-select: none; backdrop-filter: blur(4px); }
        .btn:active { background: #38bdf8; transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <div class="controls">
            <div class="btn-group"><div class="btn" id="btn-left">◀</div><div class="btn" id="btn-right">▶</div></div>
            <div class="btn-group"><div class="btn" id="btn-jump">▲</div></div>
        </div>
    </div>
    <script>
        // --- НАСТРОЙКИ ---
        const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
        canvas.width = 800; canvas.height = 480;
        const TILE = 32, GRAVITY = 0.5, JUMP = -11.5, SPEED = 3.5, MAX_FALL = 10;
        let keys = { left: false, right: false, jump: false }, player, platforms, enemies, coins, particles, camX, score, coinCount, lives, gameOver, frame;

        // --- КАРТА (Длинный уровень с ямами и трубами) ---
        const map = [
            "                                                                                                                                                                    ",
            "                                                                                                                                                                    ",
            "                                                                                                                                                                    ",
            "                         3                              3                  3                                                                                        ",
            "                                                                                                                                                                    ",
            "                 22             22      22                      22     22      22                                                                                    ",
            "                 CC             CC      CC                      CC     CC      CC                                                                                    ",
            "           3                22              22     3        22                   22       3                                                                          ",
            "           E                22              22     E        22                   22       E                                                                          ",
            "111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111"
        ];

        // --- АУДИО ---
        let audioCtx;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'jump') { osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
                else if (type === 'coin') { osc.type = 'square'; osc.frequency.setValueAtTime(988, audioCtx.currentTime); osc.frequency.setValueAtTime(1319, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
                else if (type === 'stomp') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
            } catch (e) { }
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function init() {
            player = { x: 100, y: 100, w: 24, h: 32, vx: 0, vy: 0, onGround: false, facingRight: true, state: 'idle', anim: 0, invincible: 0 };
            platforms = []; enemies = []; coins = []; particles = [];
            camX = 0; score = 0; coinCount = 0; lives = 3; gameOver = false; frame = 0;

            map.forEach((row, y) => {
                for (let x = 0; x < row.length; x++) {
                    let char = row[x];
                    if (char >= '1' && char <= '4') platforms.push({ x: x*TILE, y: y*TILE, w: TILE, h: TILE, type: char, hit: false, offset: 0 });
                    else if (char === 'E') enemies.push({ x: x*TILE, y: y*TILE, w: 28, h: 28, vx: -1.5, vy: 0, alive: true, onGround: false, type: 'goomba' });
                    else if (char === 'C') coins.push({ x: x*TILE+16, y: y*TILE+16, collected: false });
                }
            });
            // Дополнительный враг-летун
            enemies.push({ x: 1200, y: 200, w: 24, h: 24, vx: -2, vy: 0, alive: true, type: 'fly', baseY: 200, angle: 0 });
        }

        // --- ОБНОВЛЕНИЕ ЛОГИКИ ---
        function update() {
            if (gameOver) return;
            frame++; if (player.invincible > 0) player.invincible--;

            // Управление
            player.vx = 0;
            if (keys.left) { player.vx = -SPEED; player.facingRight = false; player.state = 'walk'; }
            else if (keys.right) { player.vx = SPEED; player.facingRight = true; player.state = 'walk'; }
            else player.state = 'idle';

            if (keys.jump && player.onGround) { player.vy = JUMP; player.onGround = false; player.state = 'jump'; playSound('jump'); }
            player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
            player.x += player.vx; player.y += player.vy;

            // Коллизии
            player.onGround = false;
            platforms.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
                    if (player.vy > 0 && player.y + player.h - player.vy <= p.y) { player.y = p.y - player.h; player.vy = 0; player.onGround = true; player.state = 'idle'; }
                    else if (player.vy < 0 && player.y - player.vy >= p.y + p.h) { player.y = p.y + p.h; player.vy = 0; if (p.type === '3' && !p.hit) { p.hit = true; p.offset = 10; score += 100; coinCount++; playSound('coin'); particles.push({x: p.x+16, y: p.y-10, vy: -8, life: 30, type: 'coin'}); } }
                    else { if (player.vx > 0) player.x = p.x - player.w; else if (player.vx < 0) player.x = p.x + p.w; }
                }
            });

            // Враги
            enemies.forEach(e => {
                if (!e.alive) return;
                if (e.type === 'goomba') {
                    e.vy = Math.min(e.vy + GRAVITY, MAX_FALL); e.x += e.vx; e.y += e.vy; e.onGround = false;
                    platforms.forEach(p => {
                        if (e.x < p.x + p.w && e.x + e.w > p.x && e.y < p.y + p.h && e.y + e.h > p.y) {
                            if (e.vy > 0 && e.y + e.h - e.vy <= p.y) { e.y = p.y - e.h; e.vy = 0; e.onGround = true; }
                            else if (e.vy < 0) { e.y = p.y + p.h; e.vy = 0; }
                            else { if (e.vx > 0) e.x = p.x - e.w; else e.x = p.x + p.w; e.vx *= -1; }
                        }
                    });
                    if (e.onGround) { let edge = true; platforms.forEach(p => { if (e.x + e.w > p.x && e.x < p.x + p.w && e.y + e.h + 5 > p.y && e.y + e.h + 5 < p.y + p.h + 5) edge = false; }); if (edge) e.vx *= -1; }
                } else if (e.type === 'fly') {
                    e.angle += 0.05; e.x += e.vx; e.y = e.baseY + Math.sin(e.angle) * 50;
                }
                
                if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
                    if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 10) { e.alive = false; player.vy = -8; score += 200; playSound('stomp'); }
                    else if (player.invincible <= 0) { lives--; if (lives <= 0) gameOver = true; else { player.x = 100; player.y = 100; player.vy = 0; player.invincible = 120; } }
                }
            });

            // Монеты
            coins.forEach(c => { if (!c.collected && player.x < c.x + 10 && player.x + player.w > c.x - 10 && player.y < c.y + 10 && player.y + player.h > c.y - 10) { c.collected = true; score += 100; coinCount++; playSound('coin'); } });

            // Частицы
            particles.forEach(p => { p.y += p.vy; p.vy += 0.5; p.life--; }); particles = particles.filter(p => p.life > 0);
            platforms.forEach(p => { if (p.offset > 0) p.offset--; });

            // Камера и границы
            camX += (player.x - canvas.width / 3 - camX) * 0.1;
            if (player.x < 0) player.x = 0;
            if (player.y > canvas.height + 200) { lives--; if (lives <= 0) gameOver = true; else { player.x = 100; player.y = 100; player.vy = 0; player.invincible = 120; } }
            if (player.state === 'walk') player.anim += 0.2; else player.anim = 0;

            draw();
        }

        // --- ОТРИСОВКА ---
        function draw() {
            // Фон
            let sky = ctx.createLinearGradient(0, 0, 0, canvas.height); sky.addColorStop(0, "#0f172a"); sky.addColorStop(1, "#1e3a8a");
            ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save(); ctx.translate(-camX, 0);

            // Платформы
            platforms.forEach(p => {
                let oY = p.offset > 0 ? Math.sin(p.offset * Math.PI) * 5 : 0;
                if (p.type === '1') { ctx.fillStyle = "#8B4513"; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y, p.w, 4); ctx.fillStyle = "#228B22"; ctx.fillRect(p.x, p.y+4, p.w, 4); }
                else if (p.type === '2') { ctx.fillStyle = "#D2691E"; ctx.fillRect(p.x, p.y+oY, p.w, p.h); ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y+oY, p.w, 3); ctx.strokeStyle = "#000"; ctx.strokeRect(p.x, p.y+oY, p.w, p.h); }
                else if (p.type === '3') { ctx.fillStyle = p.hit ? "#A0522D" : "#FFD700"; ctx.fillRect(p.x, p.y+oY, p.w, p.h); if (!p.hit) { ctx.fillStyle = "#000"; ctx.font = "bold 20px 'Press Start 2P'"; ctx.fillText("?", p.x+8, p.y+24+oY); } }
                else if (p.type === '4') { ctx.fillStyle = "#008000"; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y, p.w, 4); }
            });

            // Монеты
            coins.forEach(c => { if (!c.collected) { ctx.fillStyle = "#FFD700"; ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = "#B8860B"; ctx.stroke(); } });

            // Враги
            enemies.forEach(e => {
                if (!e.alive) return;
                if (e.type === 'goomba') {
                    ctx.fillStyle = "#8B4513"; ctx.beginPath(); ctx.moveTo(e.x, e.y+e.h); ctx.lineTo(e.x+e.w, e.y+e.h); ctx.lineTo(e.x+e.w-4, e.y); ctx.lineTo(e.x+4, e.y); ctx.fill();
                    ctx.fillStyle = "#FFF"; ctx.fillRect(e.x+4, e.y+8, 6, 6); ctx.fillRect(e.x+e.w-10, e.y+8, 6, 6);
                } else if (e.type === 'fly') {
                    ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(e.x+e.w/2, e.y+e.h/2, 12, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(e.x+e.w/2-4, e.y+e.h/2-4, 3, 0, Math.PI*2); ctx.fill();
                }
            });

            // Игрок
            if (player.invincible % 10 < 5) {
                let leg = Math.sin(player.anim) * 6;
                ctx.fillStyle = "#FF0000"; ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.fillStyle = "#0000FF"; ctx.fillRect(player.x+4, player.y+16, player.w-8, player.h-16);
                if (player.state === 'walk') { ctx.fillStyle = "#0000FF"; ctx.fillRect(player.x+4+leg, player.y+player.h-4, 6, 4); ctx.fillRect(player.x+14-leg, player.y+player.h-4, 6, 4); }
                else if (player.state === 'jump') { ctx.fillStyle = "#0000FF"; ctx.fillRect(player.x+2, player.y+player.h-6, 8, 6); ctx.fillRect(player.x+14, player.y+player.h-2, 8, 4); }
                ctx.fillStyle = "#FFD700"; ctx.fillRect(player.x+8, player.y+20, 2, 2); ctx.fillRect(player.x+14, player.y+20, 2, 2);
                ctx.fillStyle = "#FFCBA4";
                if (player.facingRight) { ctx.fillRect(player.x+12, player.y+6, 10, 10); ctx.fillStyle = "#000"; ctx.fillRect(player.x+18, player.y+8, 2, 2); }
                else { ctx.fillRect(player.x+2, player.y+6, 10, 10); ctx.fillStyle = "#000"; ctx.fillRect(player.x+4, player.y+8, 2, 2); }
            }

            // Частицы
            particles.forEach(p => { if (p.type === 'coin') { ctx.fillStyle = "#FFD700"; ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill(); } });

            ctx.restore();

            // UI
            ctx.fillStyle = "#fff"; ctx.font = "14px 'Press Start 2P'"; 
            ctx.fillText("SCORE: " + score, 20, 30); ctx.fillText("COINS: x" + coinCount, 20, 55); ctx.fillText("LIVES: " + lives, 20, 80);
            if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ef4444"; ctx.font = "30px 'Press Start 2P'"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2);
                ctx.fillStyle = "#fff"; ctx.font = "16px 'Press Start 2P'"; ctx.fillText("Press to restart", canvas.width/2, canvas.height/2 + 40); ctx.textAlign = "left";
            }
        }

        // --- ЦИКЛ И УПРАВЛЕНИЕ ---
        function loop() { update(); requestAnimationFrame(loop); }
        document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true; if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { keys.jump = true; e.preventDefault(); } if (e.key === 'Enter' && gameOver) init(); });
        document.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false; if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') keys.jump = false; });
        
        const bindBtn = (id, key) => { const btn = document.getElementById(id); btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }); btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }); btn.addEventListener('mousedown', () => keys[key] = true); btn.addEventListener('mouseup', () => keys[key] = false); btn.addEventListener('mouseleave', () => keys[key] = false); };
        bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-jump', 'jump');
        canvas.addEventListener('click', () => { if (gameOver) init(); });

        init(); loop();
    </script>
</body>
</html>

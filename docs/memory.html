<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Память</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;font-family:system-ui,sans-serif;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,70px);gap:10px}.card{width:70px;height:70px;background:#1e293b;border:2px solid #475569;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:32px;cursor:pointer;transition:0.3s}
.card.flipped{background:#38bdf8;border-color:#bae6fd}.card.matched{background:#0284c7;border-color:#0ea5e9;opacity:0.5}
h1{color:#38bdf8;margin-bottom:20px;text-align:center}</style></head>
<body><h1>❄️ Найди пары ❄️</h1><div class="grid" id="g"></div>
<script>
const emojis=['🎅','🎄','🎁','⛄','❄️','🦌','🔔','⭐'];
let cards=[],flipped=[],matched=0;
function init(){cards=[...emojis,...emojis].sort(()=>Math.random()-0.5);flipped=[];matched=0;
const g=document.getElementById('g');g.innerHTML='';
cards.forEach((e,i)=>{const c=document.createElement('div');c.className='card';c.dataset.v=e;c.dataset.i=i;
c.onclick=()=>flip(c);g.appendChild(c)})}
function flip(c){if(flipped.length===2||c.classList.contains('flipped')||c.classList.contains('matched'))return;
c.classList.add('flipped');c.textContent=c.dataset.v;flipped.push(c);
if(flipped.length===2){setTimeout(()=>{if(flipped[0].dataset.v===flipped[1].dataset.v){flipped.forEach(f=>{f.classList.remove('flipped');f.classList.add('matched')});matched++;
if(matched===8)setTimeout(()=>{alert('Победа!');init()},500)}else{flipped.forEach(f=>{f.classList.remove('flipped');f.textContent=''})}flipped=[]},800)}}
init();
</script></body></html>
